<style>
  :root{
    --glass: rgba(255,255,255,0.14);
    --glass-strong: rgba(255,255,255,0.22);
    --border: rgba(255,255,255,0.38);
    --text: #ffffff;
    --text-dim: rgba(255,255,255,0.72);
    --text-faint: rgba(255,255,255,0.5);
    --accent1: #FF7A59;
    --accent2: #FFC857;
    --shadow: 0 8px 32px rgba(0,0,0,0.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    font-family:'Inter', sans-serif;
    color:var(--text);
    min-height:100vh;
    display:flex;
    justify-content:center;
    overflow-x:hidden;
  }
  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;}
  }

  /* ---------- background ---------- */
  .bg{
    position:fixed; inset:0; z-index:-2;
    background: linear-gradient(120deg,#2b1055,#7597de 35%,#ff7a59 70%,#ffc857);
    background-size:300% 300%;
    animation: drift 18s ease-in-out infinite;
  }
  .bg.has-image{ animation:none; background-size:cover; background-position:center; }
  @keyframes drift{
    0%{background-position:0% 50%;}
    50%{background-position:100% 50%;}
    100%{background-position:0% 50%;}
  }
  .bg-overlay{
    position:fixed; inset:0; z-index:-1;
    background: rgba(10,8,20,0.28);
    backdrop-filter: blur(0px);
  }


  /* ---------- layout ---------- */
  .app{
    width:100%; max-width:420px;
    padding:56px 20px 60px;
    display:flex; flex-direction:column; align-items:center;
    gap:22px;
  }

  .fade-up{ opacity:0; transform:translateY(16px); animation:fadeUp .7s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes fadeUp{ to{opacity:1; transform:translateY(0);} }
  .floaty{ animation:floatY 4.6s ease-in-out infinite; }
  @keyframes floatY{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-6px); } }

  /* ---------- profile ---------- */
  .profile{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; }
  .avatar{
    position:relative; width:104px; height:104px; border-radius:50%;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    display:flex; align-items:center; justify-content:center;
    font-family:'Poppins',sans-serif; font-weight:700; font-size:38px; color:#fff;
    border:3px solid rgba(255,255,255,0.55);
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .avatar img{ width:100%; height:100%; object-fit:cover; }
  .name{
    font-family:'Poppins',sans-serif; font-weight:700; font-size:22px;
  }
  .caption{
    font-size:13.5px; color:var(--text-dim);
    max-width:280px; line-height:1.4;
  }
  .social-row{ display:flex; gap:10px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
  .social-row:empty{ display:none; }
  .social-btn{
    position:relative; overflow:hidden;
    width:38px; height:38px; border-radius:50%;
    background:var(--glass); border:1px solid var(--border);
    backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px);
    display:flex; align-items:center; justify-content:center;
    color:var(--text); text-decoration:none;
    transition:transform .2s ease, background .2s ease;
  }
  .social-btn:hover{ transform:translateY(-3px); background:var(--glass-strong); }

  /* ---------- glass card base ---------- */
  .card{
    width:100%;
    background:var(--glass);
    border:1px solid var(--border);
    border-radius:26px;
    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);
    box-shadow:var(--shadow);
    padding:22px 22px 18px;
  }

  /* ---------- now playing ---------- */
  .art-wrap{
    position:relative; width:150px; height:150px; margin:0 auto 16px;
    transition:transform .15s ease-out; will-change:transform;
  }
  .art-ring{
    position:absolute; inset:-8px; border-radius:50%;
    background:conic-gradient(from 0deg, var(--accent1), var(--accent2), var(--accent1));
    opacity:0; filter:blur(2px);
    animation:spin 6s linear infinite;
  }
  .art-ring.playing{ opacity:0.85; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .art{
    position:absolute; inset:0; width:150px; height:150px; border-radius:50%;
    object-fit:cover; border:3px solid rgba(255,255,255,0.6);
    background:linear-gradient(135deg,#444,#222);
    transition:opacity .22s ease;
  }
  .art.spinning{ animation:spin 8s linear infinite; }

  .np-fade{ transition:opacity .22s ease; }

  .track-title-wrap{ overflow:hidden; position:relative; }
  .track-title{ font-family:'Poppins',sans-serif; font-weight:600; font-size:17px; text-align:center; white-space:nowrap; display:inline-block; width:100%; }
  .track-title-wrap.marquee .track-title{
    display:inline-block; width:max-content; padding-right:40px;
    animation:marquee var(--marquee-duration,8s) linear infinite;
  }
  @keyframes marquee{
    0%, 12%{ transform:translateX(0); }
    88%, 100%{ transform:translateX(calc(-1 * var(--marquee-distance, 100px))); }
  }
  .track-artist{ font-size:13px; color:var(--text-dim); text-align:center; margin-top:2px; }

  .note-particle{
    position:absolute; pointer-events:none; font-size:15px; color:var(--accent2);
    animation:noteFloat 2.2s ease-out forwards; z-index:5;
  }
  @keyframes noteFloat{
    0%{ opacity:0; transform:translate(0,0) scale(.6) rotate(0deg); }
    15%{ opacity:1; }
    100%{ opacity:0; transform:translate(var(--note-x,10px),-90px) scale(1) rotate(20deg); }
  }

  .ripple{
    position:absolute; border-radius:50%; background:rgba(255,255,255,0.55);
    transform:scale(0); animation:rippleAnim .55s ease-out forwards;
    pointer-events:none;
  }
  @keyframes rippleAnim{
    to{ transform:scale(1); opacity:0; }
  }

  .progress-row{ display:flex; align-items:center; gap:8px; margin:16px 0 6px; }
  .time{ font-size:11px; color:var(--text-faint); width:32px; text-align:center; font-variant-numeric:tabular-nums; }
  .progress-bar{
    position:relative; flex:1; height:5px; border-radius:4px; background:rgba(255,255,255,0.25);
    cursor:pointer;
  }
  .progress-fill{
    position:absolute; left:0; top:0; height:100%; width:0%;
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    border-radius:4px;
  }
  .progress-handle{
    position:absolute; top:50%; left:0%; width:11px; height:11px; border-radius:50%;
    background:#fff; transform:translate(-50%,-50%); box-shadow:0 0 0 3px rgba(255,255,255,0.25);
  }

  .controls{ display:flex; align-items:center; justify-content:center; gap:14px; margin-top:8px; }
  .icon-btn{
    position:relative; overflow:hidden;
    background:none; border:none; color:var(--text); cursor:pointer;
    display:flex; align-items:center; justify-content:center;
    padding:8px; border-radius:50%; transition:background .2s ease, transform .15s ease;
  }
  .icon-btn:hover{ background:rgba(255,255,255,0.14); }
  .icon-btn:active{ transform:scale(0.9); }
  .icon-btn.small{ opacity:0.6; padding:6px; }
  .icon-btn.small.active{ opacity:1; color:var(--accent2); }
  .icon-btn.play{
    width:54px; height:54px;
    background:linear-gradient(135deg,var(--accent1),var(--accent2));
    box-shadow:0 6px 18px rgba(255,122,89,0.45);
  }
  .icon-btn.play:hover{ background:linear-gradient(135deg,var(--accent1),var(--accent2)); filter:brightness(1.08); }
  .icon-btn.play.playing{ animation:playPulse 1.8s ease-in-out infinite; }
  @keyframes playPulse{
    0%,100%{ box-shadow:0 6px 18px rgba(255,122,89,0.45); }
    50%{ box-shadow:0 6px 26px rgba(255,122,89,0.75), 0 0 0 7px rgba(255,196,87,0.18); }
  }

  .volume-row{ display:flex; align-items:center; gap:10px; margin-top:14px; padding:0 6px; color:var(--text-dim); }
  .volume-row input[type="range"]{
    flex:1; -webkit-appearance:none; appearance:none;
    height:4px; border-radius:4px;
    background:rgba(255,255,255,0.25);
    outline:none;
  }
  .volume-row input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none; width:13px; height:13px; border-radius:50%;
    background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.25);
    cursor:pointer;
  }
  .volume-row input[type="range"]::-moz-range-thumb{
    width:13px; height:13px; border-radius:50%; border:none;
    background:#fff; box-shadow:0 0 0 3px rgba(255,255,255,0.25);
    cursor:pointer;
  }
  .volume-row input[type="range"]::-moz-range-progress{
    background:linear-gradient(90deg,var(--accent1),var(--accent2));
    height:4px; border-radius:4px;
  }

  /* ---------- playlist ---------- */
  .playlist-header-row{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:12px; gap:10px;
  }
  .playlist-header{
    font-family:'Poppins',sans-serif; font-weight:600; font-size:15px;
    color:var(--text);
  }
  .playlist-count{ font-weight:400; font-size:12px; color:var(--text-faint); }
  .shuffle-all-btn{
    display:flex; align-items:center; gap:6px; flex-shrink:0;
    background:var(--glass); border:1px solid var(--border); border-radius:20px;
    padding:6px 12px; font-size:11.5px; font-weight:500; color:var(--text-dim);
    cursor:pointer; transition:background .2s ease, color .2s ease, transform .15s ease;
    position:relative; overflow:hidden;
  }
  .shuffle-all-btn:hover{ background:var(--glass-strong); color:var(--text); }
  .shuffle-all-btn:active{ transform:scale(0.95); }
  .playlist-list{
    display:flex; flex-direction:column; gap:6px;
    max-height:300px; overflow-y:auto;
    -webkit-overflow-scrolling:touch;
    overscroll-behavior:contain;
    touch-action:pan-y;
  }
  .playlist-list::-webkit-scrollbar{ width:4px; }
  .playlist-list::-webkit-scrollbar-thumb{ background:rgba(255,255,255,0.25); border-radius:4px; }
  .playlist-wrap{ position:relative; }
  .playlist-wrap::after{
    content:''; position:absolute; left:0; right:6px; bottom:0; height:28px;
    background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.22));
    border-radius:0 0 20px 20px; pointer-events:none;
  }

  .track-row{
    position:relative; overflow:hidden;
    display:flex; align-items:center; gap:12px; padding:10px; border-radius:16px;
    cursor:pointer; transition:background .2s ease, transform .15s ease;
    border:1px solid transparent;
  }
  .track-row:not(:last-child){ border-bottom:1px solid rgba(255,255,255,0.08); }
  .track-row.row-enter{
    opacity:0; transform:translateY(10px);
    animation:rowEnter .45s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes rowEnter{ to{ opacity:1; transform:translateY(0); } }
  .track-duration{ font-size:11px; color:var(--text-faint); flex-shrink:0; font-variant-numeric:tabular-nums; }
  .track-row:hover{ background:rgba(255,255,255,0.1); }
  .track-row.active{
    background:rgba(255,255,255,0.16); border-color:var(--border);
  }
  .track-thumb{ width:42px; height:42px; border-radius:10px; object-fit:cover; flex-shrink:0; background:#333; }
  .track-meta{ flex:1; min-width:0; }
  .track-meta .t{ font-size:13.5px; font-weight:500; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track-meta .a{ font-size:11.5px; color:var(--text-faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .eq{ display:flex; align-items:flex-end; gap:2px; height:14px; width:14px; flex-shrink:0; }
  .eq span{ width:3px; background:var(--accent2); border-radius:2px; animation:eq 0.9s ease-in-out infinite; }
  .eq span:nth-child(1){ height:40%; animation-delay:0s; }
  .eq span:nth-child(2){ height:100%; animation-delay:0.2s; }
  .eq span:nth-child(3){ height:65%; animation-delay:0.4s; }
  @keyframes eq{ 0%,100%{ transform:scaleY(0.4);} 50%{ transform:scaleY(1);} }
  .site-credit{
    font-size:12px; color:rgba(255,255,255,0.65); text-align:center;
    margin-top:6px; letter-spacing:0.2px;
  }
  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:rgba(20,16,30,0.9); border:1px solid var(--border); color:var(--text);
    padding:10px 18px; border-radius:14px; font-size:13px; opacity:0; transition:all .3s ease;
    z-index:60; pointer-events:none;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>

<script>
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._h);
  showToast._h = setTimeout(()=> t.classList.remove('show'), 2200);
}

/* ================= ripple effect ================= */
document.addEventListener('pointerdown', (e)=>{
  const target = e.target.closest('.icon-btn, .social-btn, .track-row');
  if(!target) return;
  const rect = target.getBoundingClientRect();
  const size = Math.max(rect.width, rect.height) * 1.6;
  const ripple = document.createElement('span');
  ripple.className = 'ripple';
  ripple.style.width = ripple.style.height = size + 'px';
  ripple.style.left = (e.clientX - rect.left - size/2) + 'px';
  ripple.style.top = (e.clientY - rect.top - size/2) + 'px';
  target.appendChild(ripple);
  ripple.addEventListener('animationend', ()=> ripple.remove());
});

function fmtTime(sec){
  if(!isFinite(sec) || sec < 0) sec = 0;
  const m = Math.floor(sec/60);
  const s = Math.floor(sec%60).toString().padStart(2,'0');
  return `${m}:${s}`;
}

/* ================= render playlist ================= */
const FALLBACK_ART = 'data:image/svg+xml,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
  '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
  '<stop offset="0" stop-color="#FF7A59"/><stop offset="1" stop-color="#FFC857"/>' +
  '</linearGradient></defs>' +
  '<rect width="100" height="100" fill="url(#g)"/>' +
  '<text x="50" y="63" font-size="42" text-anchor="middle" fill="white">%E2%99%AB</text></svg>'
);

let playlistFirstRender = true;
function renderPlaylist(){
  const list = document.getElementById('playlistList');
  const countEl = document.getElementById('playlistCount');
  if(countEl) countEl.textContent = `· ${playlist.length} song${playlist.length === 1 ? '' : 's'}`;
  list.innerHTML = '';
  playlist.forEach((track, i)=>{
    const row = document.createElement('div');
    row.className = 'track-row' + (i === currentIndex ? ' active' : '') + (playlistFirstRender ? ' row-enter' : '');
    if(playlistFirstRender){ row.style.animationDelay = (i * 0.06) + 's'; }
    row.innerHTML = `
      <img class="track-thumb" src="${track.art || `https://img.youtube.com/vi/${track.id}/default.jpg`}" alt="">
      <div class="track-meta">
        <div class="t">${escapeHtml(track.title)}</div>
        <div class="a">${escapeHtml(track.artist)}</div>
      </div>
      ${track.duration ? `<div class="track-duration">${escapeHtml(track.duration)}</div>` : ''}
      ${i === currentIndex ? '<div class="eq"><span></span><span></span><span></span></div>' : ''}
    `;
    const thumb = row.querySelector('.track-thumb');
    thumb.addEventListener('error', function(){ this.onerror = null; this.src = FALLBACK_ART; }, { once:true });
    row.addEventListener('click', ()=> loadTrack(i, true));
    list.appendChild(row);
  });
  playlistFirstRender = false;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

    .join('');

/* ================= player logic ================= */
function loadTrack(index, autoplay){
  if(playlist.length === 0) return;
  currentIndex = ((index % playlist.length) + playlist.length) % playlist.length;
  const track = playlist[currentIndex];
  const npFade = document.getElementById('npFade');
  const artEl = document.getElementById('art');

  npFade.style.opacity = 0;
  artEl.style.opacity = 0;

  setTimeout(()=>{
    document.getElementById('trackTitle').textContent = track.title;
    document.getElementById('trackArtist').textContent = track.artist;
    artEl.src = track.art || `https://img.youtube.com/vi/${track.id}/hqdefault.jpg`;
    applyMarquee();
    npFade.style.opacity = 1;
    artEl.style.opacity = 1;
  }, 220);

  renderPlaylist();
  resetProgressUI();
  if(playerReady && player){
    if(autoplay){ player.loadVideoById(track.id); }
    else { player.cueVideoById(track.id); }
  }
}

function applyMarquee(){
  const wrap = document.querySelector('.track-title-wrap');
  const title = document.getElementById('trackTitle');
  wrap.classList.remove('marquee');
  title.style.animation = 'none';
  // measure after the layout settles
  requestAnimationFrame(()=>{
    const overflow = title.scrollWidth - wrap.clientWidth;
    if(overflow > 4){
      const distance = overflow + 40;
      const duration = Math.max(6, distance / 28);
      wrap.style.setProperty('--marquee-distance', distance + 'px');
      wrap.style.setProperty('--marquee-duration', duration + 's');
      title.style.animation = '';
      wrap.classList.add('marquee');
    }
  });
}

function resetProgressUI(){
  document.getElementById('progressFill').style.width = '0%';
  document.getElementById('progressHandle').style.left = '0%';
  document.getElementById('curTime').textContent = '0:00';
  document.getElementById('durTime').textContent = '0:00';
}

let noteInterval = null;
function spawnNote(){
  const wrap = document.getElementById('artWrap');
  if(!wrap) return;
  const note = document.createElement('div');
  note.className = 'note-particle';
  note.textContent = ['♪','♫','♬'][Math.floor(Math.random()*3)];
  const startX = 20 + Math.random()*110;
  const drift = (Math.random()*40 - 20) + 'px';
  note.style.left = startX + 'px';
  note.style.bottom = '10px';
  note.style.setProperty('--note-x', drift);
  wrap.appendChild(note);
  note.addEventListener('animationend', ()=> note.remove());
}

function setPlayingVisual(playing){
  document.getElementById('artRing').classList.toggle('playing', playing);
  document.getElementById('art').classList.toggle('spinning', playing);
  document.getElementById('playBtn').classList.toggle('playing', playing);
  const icon = document.getElementById('playIcon');
  icon.innerHTML = playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';

  clearInterval(noteInterval);
  if(playing){
    noteInterval = setInterval(spawnNote, 650);
  }
}

function togglePlay(){
  if(!playerReady || playlist.length === 0) return;
  const state = player.getPlayerState();
  if(state === 1){ player.pauseVideo(); }
  else { player.playVideo(); }
}

function playNext(manual){
  if(playlist.length === 0) return;
  let next;
  if(isShuffle && playlist.length > 1){
    do{ next = Math.floor(Math.random()*playlist.length); } while(next === currentIndex);
  } else {
    next = currentIndex + 1;
  }
  loadTrack(next, true);
}
function playPrev(){
  if(playlist.length === 0) return;
  loadTrack(currentIndex - 1, true);
}

function startProgressTimer(){
  clearInterval(progressTimer);
  progressTimer = setInterval(()=>{
    if(!playerReady || isDraggingSeek) return;
    try{
      const dur = player.getDuration();
      const cur = player.getCurrentTime();
      if(dur > 0){
        document.getElementById('progressFill').style.width = (cur/dur*100)+'%';
        document.getElementById('progressHandle').style.left = (cur/dur*100)+'%';
        document.getElementById('curTime').textContent = fmtTime(cur);
        document.getElementById('durTime').textContent = fmtTime(dur);
      }
    }catch(e){}
  }, 400);
}

/* YouTube IFrame API  */
function onYouTubeIframeAPIReady(){
  player = new YT.Player('ytPlayer', {
    height:'1', width:'1',
    videoId: playlist.length ? playlist[currentIndex].id : undefined,
    playerVars:{ playsinline:1, autoplay:1, mute:1 },
    events:{
      onReady: ()=>{
        playerReady = true;
        startProgressTimer();
        player.setVolume(document.getElementById('volumeSlider').value);
        // Browsers block autoplay with sound until the visitor interacts
        // with the page, so we start muted and unmute on the first tap.
        player.mute();
        player.playVideo();
        armAutoUnmute();
      },
      onStateChange: (e)=>{
        if(e.data === YT.PlayerState.PLAYING){ setPlayingVisual(true); }
        if(e.data === YT.PlayerState.PAUSED){ setPlayingVisual(false); }
        if(e.data === YT.PlayerState.ENDED){
          setPlayingVisual(false);
          if(isRepeat){ player.seekTo(0); player.playVideo(); }
          else { playNext(false); }
        }
      }
    }
  });
}
function armAutoUnmute(){
  const unmuteOnce = ()=>{
    if(player && player.unMute){ player.unMute(); }
    document.removeEventListener('click', unmuteOnce);
    document.removeEventListener('touchstart', unmuteOnce);
    document.removeEventListener('keydown', unmuteOnce);
  };
  document.addEventListener('click', unmuteOnce);
  document.addEventListener('touchstart', unmuteOnce);
  document.addEventListener('keydown', unmuteOnce);
}
const ytScript = document.createElement('script');
ytScript.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(ytScript);

/* ================= wire up controls ================= */
document.getElementById('playBtn').addEventListener('click', togglePlay);
document.getElementById('nextBtn').addEventListener('click', ()=>playNext(true));
document.getElementById('prevBtn').addEventListener('click', playPrev);
document.getElementById('shuffleBtn').addEventListener('click', (e)=>{
  isShuffle = !isShuffle;
  e.currentTarget.classList.toggle('active', isShuffle);
  showToast(isShuffle ? 'Shuffle on' : 'Shuffle off');
});
document.getElementById('shuffleAllBtn').addEventListener('click', ()=>{
  if(playlist.length === 0) return;
  isShuffle = true;
  document.getElementById('shuffleBtn').classList.add('active');
  let next;
  do{ next = Math.floor(Math.random()*playlist.length); } while(playlist.length > 1 && next === currentIndex);
  loadTrack(next, true);
  showToast('Shuffling your playlist');
});
document.getElementById('repeatBtn').addEventListener('click', (e)=>{
  isRepeat = !isRepeat;
  e.currentTarget.classList.toggle('active', isRepeat);
  showToast(isRepeat ? 'Repeat on' : 'Repeat off');
});

const progressBar = document.getElementById('progressBar');
function seekFromEvent(e){
  const rect = progressBar.getBoundingClientRect();
  const clientX = e.touches ? e.touches[0].clientX : e.clientX;
  let ratio = (clientX - rect.left) / rect.width;
  ratio = Math.max(0, Math.min(1, ratio));
  document.getElementById('progressFill').style.width = (ratio*100)+'%';
  document.getElementById('progressHandle').style.left = (ratio*100)+'%';
  if(playerReady){
    const dur = player.getDuration();
    if(dur > 0){ player.seekTo(dur*ratio, true); }
  }
}
progressBar.addEventListener('mousedown', (e)=>{ isDraggingSeek = true; seekFromEvent(e); });
window.addEventListener('mousemove', (e)=>{ if(isDraggingSeek) seekFromEvent(e); });
window.addEventListener('mouseup', ()=>{ isDraggingSeek = false; });
progressBar.addEventListener('touchstart', (e)=>{ isDraggingSeek = true; seekFromEvent(e); });
progressBar.addEventListener('touchmove', (e)=>{ if(isDraggingSeek) seekFromEvent(e); });
progressBar.addEventListener('touchend', ()=>{ isDraggingSeek = false; });

/* volume slider */
const volumeSlider = document.getElementById('volumeSlider');
function paintVolumeTrack(val){
  volumeSlider.style.background =
    `linear-gradient(90deg, var(--accent1) 0%, var(--accent2) ${val}%, rgba(255,255,255,0.25) ${val}%, rgba(255,255,255,0.25) 100%)`;
}
volumeSlider.addEventListener('input', ()=>{
  const val = volumeSlider.value;
  paintVolumeTrack(val);
  if(playerReady && player.setVolume){ player.setVolume(val); }
});
paintVolumeTrack(volumeSlider.value);

/*  profile: name / caption*/
const nameEl = document.getElementById('name');
const captionEl = document.getElementById('caption');

function applyBackground(url){
  const bg = document.getElementById('bg');
  bg.style.backgroundImage = `url(${url})`;
  bg.classList.add('has-image');
}

function applyFavicon(){
  const link = document.getElementById('favicon');
  if(AVATAR_URL){
    link.href = AVATAR_URL;
  } else {
    link.href = 'data:image/svg+xml,' + encodeURIComponent(
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">' +
      '<circle cx="50" cy="50" r="48" fill="%23FF7A59"/>' +
      '<text x="50" y="66" font-size="55" text-anchor="middle">🎵</text></svg>'
    );
  }
}

/* boot */
async function boot(){
  nameEl.textContent = PROFILE_NAME;
  captionEl.textContent = PROFILE_CAPTION;
  renderSocialLinks();
  applyFavicon();
  if(AVATAR_URL){
    document.getElementById('avatarImg').src = AVATAR_URL;
    document.getElementById('avatarImg').style.display = 'block';
    document.getElementById('avatarInitial').style.display = 'none';
  }
  applyBackground(DEFAULT_BG_URL);

  renderPlaylist();
  if(playlist.length){
    document.getElementById('trackTitle').textContent = playlist[currentIndex].title;
    document.getElementById('trackArtist').textContent = playlist[currentIndex].artist;
    document.getElementById('art').src = playlist[currentIndex].art || `https://img.youtube.com/vi/${playlist[currentIndex].id}/hqdefault.jpg`;
    applyMarquee();
  }
}
boot();

/* gentle float after entrance */
document.querySelectorAll('.fade-up').forEach((el, i)=>{
  el.addEventListener('animationend', function handler(e){
    if(e.animationName !== 'fadeUp') return;
    el.removeEventListener('animationend', handler);
    el.style.animationDuration = (4.2 + i * 0.6) + 's';
    el.classList.remove('fade-up');
    el.classList.add('floaty');
  });
});

/* album art mouse tilt */
const artWrapEl = document.getElementById('artWrap');
artWrapEl.addEventListener('mousemove', (e)=>{
  const rect = artWrapEl.getBoundingClientRect();
  const relX = (e.clientX - rect.left) / rect.width - 0.5;
  const relY = (e.clientY - rect.top) / rect.height - 0.5;
  const rotateY = relX * 20;
  const rotateX = relY * -20;
  artWrapEl.style.transform = `perspective(400px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});
artWrapEl.addEventListener('mouseleave', ()=>{
  artWrapEl.style.transform = 'perspective(400px) rotateX(0) rotateY(0)';
});
